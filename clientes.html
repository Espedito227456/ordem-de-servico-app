<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex items-center justify-between">
    <a href="index.html" class="text-white">
      <i class="fa fa-arrow-left"></i>
    </a>
    <h1 class="text-lg font-bold">Clientes</h1>
    <div></div>
  </header>

  <!-- MAIN -->
  <main class="p-4">

    <!-- FORMULÁRIO -->
    <section aria-labelledby="form-cliente">

      <h2 id="form-cliente" class="text-md font-semibold mb-3">
        Cadastrar Cliente
      </h2>

    <form id="formCliente">

        <input id="nome" class="input" placeholder="Nome do cliente" required>

        <input id="telefone" class="input" placeholder="Telefone">

        <input id="endereco" class="input" placeholder="Endereço">

        <button type="submit" class="btn mt-2">
          <i class="fa fa-save"></i>
          Salvar
        </button>

      </form>

    </section>

    <!-- LISTA -->
    <section aria-labelledby="lista-clientes" class="mt-6">

      <h2 id="lista-clientes" class="text-md font-semibold mb-1">
        Lista de Clientes
      </h2>

      <!-- 💎 indicador de uso do limite do plano grátis (ver js/plano.js) -->
      <p id="infoLimiteClientes" class="text-xs text-gray-500 mb-3"></p>

      <ul id="listaClientes"></ul>

    </section>

    <!-- 📢 Banner de anúncio (some automaticamente para usuários Premium) -->
    <div id="ad-container" class="hidden mt-4"></div>

  </main>

  <!-- FOOTER -->
  <footer class="text-center text-sm text-gray-500 p-4">
    <p>&copy; 2026 App OS</p>
  </footer>
  
  <script type="module">
import {
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// 🔥 Firebase + sistema de planos/anúncios centralizados (ver pasta js/)
import { auth, db } from "./js/firebase.js";
import {
  garantirUsuario,
  obterDadosUsuario,
  verificarLimiteClientes,
  alertarLimiteAtingido
} from "./js/plano.js";
import { renderAdBanner } from "./js/ads.js";

let currentUser = null;
let dadosUsuarioAtual = null; // 💎 cache do documento usuarios/{uid} (plano atual)

console.log("🔥 Firebase pronto");

// ================= AUTH =================
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  // 💎 garante o doc de plano e carrega os dados (idempotente)
  await garantirUsuario(user);
  dadosUsuarioAtual = await obterDadosUsuario(user.uid);

  renderAdBanner("ad-container", dadosUsuarioAtual);

  listarClientes();
  atualizarInfoLimite();
});

// ================= SALVAR =================
async function salvarCliente(nome, telefone, endereco) {
  await addDoc(collection(db, "clientes"), {
    nome,
    telefone,
    endereco,
    criadoEm: new Date(),
    uid: currentUser.uid // 🔥 ESSENCIAL
  });
}

// ================= 💎 LIMITE DO PLANO GRÁTIS =================
// Atualiza o texto "X/15 clientes (grátis)" acima da lista. Usuários
// Premium veem apenas "Clientes cadastrados: X" (sem limite).
async function atualizarInfoLimite() {
  const info = document.getElementById("infoLimiteClientes");
  const { usado, limite } = await verificarLimiteClientes(currentUser.uid, dadosUsuarioAtual);

  info.textContent = Number.isFinite(limite)
    ? `${usado}/${limite} clientes usados (plano grátis)`
    : `${usado} clientes cadastrados (ilimitado · Premium)`;
}

// ================= LISTAR =================
async function listarClientes() {
  const lista = document.getElementById("listaClientes");
  lista.innerHTML = "";

  const q = query(
    collection(db, "clientes"),
    where("uid", "==", currentUser.uid)
  );

  const snapshot = await getDocs(q);

  snapshot.forEach((item) => {
    const c = item.data();

    const li = document.createElement("li");
    li.className = "p-2 bg-white mb-2 rounded shadow flex justify-between";

    li.innerHTML = `
      <div>
        <strong>${c.nome}</strong><br>
        <small>${c.telefone || ""}</small>
      </div>

      <button onclick="deletarCliente('${item.id}')" class="text-red-500">
        Excluir
      </button>
    `;

    lista.appendChild(li);
  });
}

// ================= EXCLUIR =================
async function deletarCliente(id) {
  if (!confirm("Deseja excluir este cliente?")) return;

  await deleteDoc(doc(db, "clientes", id));
  listarClientes();
  atualizarInfoLimite(); // 💎 libera espaço no limite do plano grátis
}

window.deletarCliente = deletarCliente;

// ================= FORM =================
document.getElementById("formCliente").addEventListener("submit", async (e) => {
  e.preventDefault();

  // 💎 bloqueia o cadastro se o plano grátis já atingiu o limite de clientes
  const limite = await verificarLimiteClientes(currentUser.uid, dadosUsuarioAtual);

  if (!limite.permitido) {
    alertarLimiteAtingido(
      `Você atingiu o limite de ${limite.limite} clientes do plano grátis.`
    );
    return;
  }

  const nome = document.getElementById("nome").value;
  const telefone = document.getElementById("telefone").value;
  const endereco = document.getElementById("endereco").value;

  await salvarCliente(nome, telefone, endereco);

  e.target.reset();
  listarClientes();
  atualizarInfoLimite();
});
</script>

  
  
</body>
</html>
