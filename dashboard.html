<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Financeiro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 p-4">

<header class="flex justify-between items-center mb-5">
  <a href="index.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow">
    Voltar
  </a>
  <h1 class="text-xl font-bold">Dashboard Financeiro</h1>
</header>

<!-- RESUMO -->
<section class="grid grid-cols-2 gap-4 mb-6">

  <article class="bg-gradient-to-r from-green-500 to-green-600 text-white p-4 rounded-xl shadow">
    <p class="text-sm opacity-80">Total Recebido</p>
    <h2 class="text-2xl font-bold" id="totalRecebido">R$ 0</h2>

    <div class="mt-2 flex items-center gap-2">
      <span id="crescimentoIcon" class="text-lg"></span>
      <span id="crescimentoText" class="text-sm font-semibold"></span>
    </div>
  </article>

  <article class="bg-gradient-to-r from-orange-500 to-orange-600 text-white p-4 rounded-xl shadow">
    <p class="text-sm opacity-80">Pendentes</p>
    <h2 class="text-2xl font-bold" id="pendentes">0</h2>
  </article>

</section>



<section class="grid grid-cols-2 gap-4 mb-6">
    <article class="bg-gradient-to-r from-blue-500 to-blue-600 text-white p-4 rounded-xl shadow">
  <p class="text-sm opacity-80">Tempo médio</p>
  <h2 class="text-2xl font-bold" id="tempoMedio">0h</h2>
</article>
</section>

<!-- FILTRO + 💎 EXPORTAÇÃO (Premium) -->
<div class="flex items-center gap-2 mb-4">
  <select id="filtroPeriodo" class="p-2 border rounded flex-1">
    <option value="dia">Diário</option>
    <option value="semana">Semanal</option>
    <option value="quinzena">Quinzenal</option>
    <option value="mes">Mensal</option>
    <option value="ano">Anual</option>
  </select>

  <!-- Recurso Premium: usuários do plano grátis recebem um convite para
       assinar ao clicar (ver exportarCSV() no script abaixo). -->
  <button id="btnExportarCSV"
    class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg shadow text-sm whitespace-nowrap">
    📄 Exportar CSV
  </button>
</div>

<!-- GRÁFICOS -->
<section class="space-y-5">

  <div class="bg-white p-4 rounded-xl shadow">
    <p class="font-semibold mb-3">Status das OS</p>
    <canvas id="graficoPizza"></canvas>
  </div>

  <div class="bg-white p-4 rounded-xl shadow">
    <p class="font-semibold mb-3">Faturamento</p>
    <canvas id="graficoColuna"></canvas>
  </div>

</section>

<!-- 📢 Banner de anúncio (some automaticamente para usuários Premium) -->
<div id="ad-container" class="hidden mt-5"></div>

<!-- FIREBASE -->
<script type="module">
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import { query, where } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import { updateDoc, doc, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// 🔥 Firebase + sistema de planos/anúncios centralizados (ver pasta js/)
import { auth, db } from "./js/firebase.js";
import { garantirUsuario, obterDadosUsuario, isPremium, alertarLimiteAtingido } from "./js/plano.js";
import { renderAdBanner } from "./js/ads.js";

async function concluirOS(id) {
  const docRef = doc(db, "ordens", id);

  await updateDoc(docRef, {
    status: "concluida",
    completedAt: serverTimestamp() // 🔥 ESSENCIAL
  });
}

let pizzaChart;
let barChart;


/* INIT */
let usuarioLogado = null;
let dadosUsuarioAtual = null; // 💎 cache do documento usuarios/{uid} (plano atual)

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  usuarioLogado = user;

  // 💎 garante o doc de plano e carrega os dados (idempotente)
  await garantirUsuario(user);
  dadosUsuarioAtual = await obterDadosUsuario(user.uid);

  renderAdBanner("ad-container", dadosUsuarioAtual);

  carregarDashboard();
});

document.getElementById("filtroPeriodo").addEventListener("change", () => {
  carregarDashboard();
});

// ================= 💎 EXPORTAR CSV (recurso Premium) =================
// Gera um CSV com todas as OS do usuário (bom para contador/Imposto de
// Renda). Usuários do plano grátis recebem o convite de upgrade.
document.getElementById("btnExportarCSV").addEventListener("click", async () => {

  if (!isPremium(dadosUsuarioAtual)) {
    alertarLimiteAtingido("Exportar relatório em CSV é um recurso exclusivo do plano Premium.");
    return;
  }

  const q = query(collection(db, "ordens"), where("uid", "==", usuarioLogado.uid));
  const snapshot = await getDocs(q);

  const cabecalho = ["Titulo", "Cliente", "Descricao", "Execucao", "Valor", "Status", "CriadaEm", "ConcluidaEm"];
  const linhas = [cabecalho];

  snapshot.forEach((docItem) => {
    const os = docItem.data();

    linhas.push([
      os.titulo || "",
      os.cliente || "",
      os.descricao || "",
      os.execucao || "",
      Number(os.valor || 0).toFixed(2),
      os.status || "",
      os.createdAt?.toDate?.().toLocaleString("pt-BR") || "",
      os.completedAt?.toDate?.().toLocaleString("pt-BR") || ""
    ]);
  });

  // escapa aspas/vírgulas de cada célula para gerar um CSV válido
  const csv = linhas
    .map((linha) => linha.map((celula) => `"${String(celula).replace(/"/g, '""')}"`).join(";"))
    .join("\n");

  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `relatorio-os-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();

  URL.revokeObjectURL(url);
});

/* DASHBOARD */
async function carregarDashboard() {

  const faturamento = {};

  if (!usuarioLogado) return;

  const q = query(
    collection(db, "ordens"),
    where("uid", "==", usuarioLogado.uid)
  );

const snapshot = await getDocs(q);

  const periodo = document.getElementById("filtroPeriodo").value;

  const hoje = new Date();
  
  let somaTempo = 0;
  let qtdTempo = 0;
  let total = 0;
  let abertas = 0;
  let emAndamento = 0;
  let concluidas = 0;
  let atual = 0;
  let anterior = 0;

 

  snapshot.forEach((doc) => {
  
    const os = doc.data();
    
const dataCriacao = os.createdAt?.toDate
  ? os.createdAt.toDate()
  : os.createdAt
    ? new Date(os.createdAt)
    : null; //inicio
  
const dataConclusao = os.completedAt?.toDate
  ? os.completedAt.toDate()
  : os.completedAt
    ? new Date(os.completedAt)
    : null; //fim
    
    

    let tempo = null;


    const status = normalizar(os.status);

    if (status === "aberta") abertas++;
    if (status === "em_andamento") emAndamento++;
    if (status === "concluida") concluidas++;

    if (status !== "concluida") return;
    
    if (dataCriacao instanceof Date && dataConclusao instanceof Date) {

  const tempo = dataConclusao.getTime() - dataCriacao.getTime();

  if (!isNaN(tempo) && tempo > 0) {
    somaTempo += tempo;
    qtdTempo++;
  }
}


    const valor = Number(os.valor || 0);

   const dataBase = dataConclusao || dataCriacao;
if (!dataBase) return;


let dentroDoPeriodo = false;

 const diff = diasEntre(hoje, dataBase);

if (periodo === "dia") dentroDoPeriodo = diff === 0;
if (periodo === "semana") dentroDoPeriodo = diff <= 7;
if (periodo === "quinzena") dentroDoPeriodo = diff <= 15;
if (periodo === "mes") dentroDoPeriodo = diff <= 30;
if (periodo === "ano") dentroDoPeriodo = diff <= 365;

if (!dentroDoPeriodo) return;


    total += valor;
    
    

 

    /* CRESCIMENTO */
    if (periodo === "dia") {
      if (diff === 0) atual += valor;
      if (diff === 1) anterior += valor;
    }

    if (periodo === "semana") {
      const s1 = Math.floor(hoje.getTime() / 604800000);
      const s2 = Math.floor(dataBase.getTime() / 604800000);
      if (s1 === s2) atual += valor;
      if (s1 - 1 === s2) anterior += valor;
    }

    if (periodo === "quinzena") {
      const p1 = hoje.getDate() <= 15 ? 1 : 2;
      const p2 = dataCriacao.getDate() <= 15 ? 1 : 2;

      if (p1 === p2) atual += valor;
      else anterior += valor;
    }

    if (periodo === "mes") {
      const m = hoje.getMonth();
      const a = hoje.getFullYear();

      const mAnt = m === 0 ? 11 : m - 1;
      const aAnt = m === 0 ? a - 1 : a;

      if (dataBase.getMonth() === m && dataCriacao.getFullYear() === a) atual += valor;
      if (dataBase.getMonth() === mAnt && dataCriacao.getFullYear() === aAnt) anterior += valor;
    }

    if (periodo === "ano") {
      const a = hoje.getFullYear();

      if (dataCriacao.getFullYear() === a) atual += valor;
      if (dataCriacao.getFullYear() === a - 1) anterior += valor;
    }

    /* FATURAMENTO */
    const chave = gerarChave(periodo, dataBase);

    faturamento[chave] = (faturamento[chave] || 0) + valor;
  });

  const crescimento = calcularCrescimento(atual, anterior);

  setCrescimentoUI(crescimento);

  document.getElementById("totalRecebido").innerText = `R$ ${total.toFixed(2)}`;
  document.getElementById("pendentes").innerText = abertas + emAndamento;

  renderCharts(faturamento, abertas, emAndamento, concluidas);
  
  let mediaHoras = 0;

if (qtdTempo > 0) {
  mediaHoras = somaTempo / qtdTempo / (1000 * 60 * 60);
}

document.getElementById("tempoMedio").innerText =
  `${mediaHoras.toFixed(1)} horas`;
}



/* ================= HELPERS ================= */

function normalizar(texto) {
  return (texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function diasEntre(a, b) {
  return Math.floor((a - b) / (1000 * 60 * 60 * 24));
}

function getSemanaDoAno(data) {
  const primeiroDia = new Date(data.getFullYear(), 0, 1);
  const dias = Math.floor((data - primeiroDia) / (1000 * 60 * 60 * 24));
  return Math.ceil((dias + primeiroDia.getDay() + 1) / 7);
}



function gerarChave(periodo, data) {
  switch (periodo) {
    case "dia": return data.toLocaleDateString();
    case "semana": return `${data.getFullYear()} - Semana ${getSemanaDoAno(data)}`;
    case "quinzena": return data.getDate() <= 15 ? "1ª Quinzena" : "2ª Quinzena";
    case "mes": return `${data.getMonth() + 1}/${data.getFullYear()}`;
    case "ano": return data.getFullYear();
  }
}

function calcularCrescimento(atual, anterior) {
  if (anterior > 0) return ((atual - anterior) / anterior) * 100;
  return atual > 0 ? 100 : 0;
}

/* UI crescimento mais bonito */
function setCrescimentoUI(valor) {
  const icon = document.getElementById("crescimentoIcon");
  const text = document.getElementById("crescimentoText");

  const positivo = valor >= 0;

  icon.textContent = positivo ? "📈" : "📉";
  text.textContent = `${positivo ? "+" : ""}${valor.toFixed(1)}%`;

  text.className = positivo
    ? "text-green-600 text-sm font-semibold"
    : "text-red-600 text-sm font-semibold";
}

/* CHARTS */
function renderCharts(faturamento, abertas, emAndamento, concluidas) {

  if (pizzaChart) pizzaChart.destroy();
  if (barChart) barChart.destroy();

  pizzaChart = new Chart(document.getElementById("graficoPizza"), {
    type: "pie",
    data: {
      labels: ["Abertas", "Em andamento", "Concluídas"],
      datasets: [{
        data: [abertas, emAndamento, concluidas],
        backgroundColor: ["#ef4444", "#facc15", "#22c55e"]
      }]
    }
  });

 // 🔥 AQUI entra a ordenação (ANTES do gráfico de barras)

const dadosOrdenados = Object.entries(faturamento)
  .sort((a, b) => {

    const chaveA = a[0];
    const chaveB = b[0];

    // SEMANA (formato: "2026 - Semana 16")
    if (chaveA.includes("Semana")) {
      const [anoA, semA] = chaveA.split(" - Semana ");
      const [anoB, semB] = chaveB.split(" - Semana ");

      return (anoA - anoB) || (semA - semB);
    }

    // MÊS (formato: "4/2026")
    if (chaveA.includes("/")) {
      const [mesA, anoA] = chaveA.split("/");
      const [mesB, anoB] = chaveB.split("/");

      return (anoA - anoB) || (mesA - mesB);
    }

    // ANO
    if (!isNaN(chaveA)) {
      return chaveA - chaveB;
    }

    // DIA (fallback)
    const dataA = new Date(chaveA.split("/").reverse().join("-"));
    const dataB = new Date(chaveB.split("/").reverse().join("-"));

    return dataA - dataB;
  });

  const labels = dadosOrdenados.map(item => item[0]);
  const valores = dadosOrdenados.map(item => item[1]);

  // 🔥 GRÁFICO DE BARRAS (usa os dados ordenados)
  barChart = new Chart(document.getElementById("graficoColuna"), {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "Faturamento",
        data: valores,
        backgroundColor: "#3b82f6"
      }]
    }
  });
}

</script>

</body>
</html>
