<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<main class="auth-wrapper">

  <section class="auth-card">

    <header>
      <h1>Login</h1>
      <p>Entre com sua conta</p>
    </header>

    <!-- FORM LOGIN -->
    <form id="formLogin">

      <div class="form-group">
        <label>Email</label>
        <input id="email" type="email" placeholder="Seu email" required>
      </div>

     <div class="form-group password-wrapper">
  <label>Senha</label>

  <div class="input-icon">
    <input id="senha" type="password" placeholder="Sua senha" required>
   <span id="toggleSenha" class="eye">
  <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
</span>
  </div>
</div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">
          Entrar
        </button>
      </div>

    </form>

    <!-- ================= 🔐 LOGIN COM GOOGLE ================= -->
    <div class="divider"><span>ou</span></div>

    <button type="button" id="btnGoogleLogin" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.9 6.1 29.8 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.9 6.1 29.8 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.7 0 10.8-2.2 14.6-5.8l-6.7-5.7C29.8 34.5 27 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4 5.8l6.7 5.7C41.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
      <span id="btnGoogleLoginTexto">Continuar com o Google</span>
    </button>

    <div class="auth-link">
      Não tem conta? <a href="cadastro.html">Cadastrar</a>
    </div>

  </section>

</main>

<!-- ============================================================
     👁️ TOGGLE "MOSTRAR SENHA" — script separado (NÃO é type="module")
     de propósito: assim ele funciona sempre, mesmo se o Firebase
     não conseguir carregar (sem internet, CDN fora do ar, ou o
     arquivo aberto direto via file:// em vez de um servidor local).
     Antes esse código ficava junto do script do Firebase: se o
     módulo falhasse, o olho parava de funcionar também.
     ============================================================ -->
<script>
  const senhaInput = document.getElementById("senha");
  const toggleSenha = document.getElementById("toggleSenha");
  const eyeIcon = document.getElementById("eyeIcon");

  toggleSenha.addEventListener("click", () => {
    const escondida = senhaInput.type === "password";

    senhaInput.type = escondida ? "text" : "password";

    if (escondida) {
      eyeIcon.classList.remove("fa-eye-slash");
      eyeIcon.classList.add("fa-eye");
    } else {
      eyeIcon.classList.remove("fa-eye");
      eyeIcon.classList.add("fa-eye-slash");
    }
  });
</script>

<!-- FIREBASE LOGIN -->
<script type="module">
import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// 🔥 Firebase e sistema de planos centralizados (ver js/firebase.js e js/plano.js)
import { auth } from "./js/firebase.js";
import { garantirUsuario } from "./js/plano.js";

document.getElementById("formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, senha);

    // 💎 Garante (de forma idempotente) que contas antigas, criadas antes do
    // sistema de planos existir, também ganhem um documento usuarios/{uid}
    // com plano "free". Ver js/plano.js.
    await garantirUsuario(userCredential.user);

    alert("Login realizado com sucesso!");
    window.location.href = "index.html";

  } catch (error) {
    alert("Erro: " + error.message);
  }
});

// ================= 🔐 LOGIN COM GOOGLE =================
// IMPORTANTE: para isso funcionar, o provedor "Google" precisa estar
// habilitado em Firebase Console > Authentication > Sign-in method.
// signInWithPopup abre uma janela do Google e já autentica o usuário —
// não existe um passo de "login" separado depois, por isso aqui já
// redirecionamos direto para index.html (sem passar por login.html de novo).
const googleProvider = new GoogleAuthProvider();
const btnGoogleLogin = document.getElementById("btnGoogleLogin");

btnGoogleLogin.addEventListener("click", async () => {
  btnGoogleLogin.disabled = true;

  try {
    const result = await signInWithPopup(auth, googleProvider);

    // 💎 mesma garantia de plano "free" usada no login por e-mail/senha
    await garantirUsuario(result.user);

    window.location.href = "index.html";

  } catch (error) {
    // usuário fechou o popup não é um "erro" de verdade — não precisa de alerta
    if (error.code !== "auth/popup-closed-by-user") {
      alert("Erro ao entrar com Google: " + error.message);
    }
    btnGoogleLogin.disabled = false;
  }
});


const botao = document.querySelector(".btn-primary");

document.getElementById("formLogin").addEventListener("submit", async (e) => {
  e.preventDefault();

  botao.innerText = "Entrando...";
  botao.disabled = true;

  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, senha);

    // 💎 idempotente — ver comentário no primeiro listener de submit acima.
    await garantirUsuario(userCredential.user);

    window.location.href = "index.html";

  } catch (error) {
    alert("Erro: " + error.message);
    botao.innerText = "Entrar";
    botao.disabled = false;
  }
});
</script>

</body>
</html>
